[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tackle-vision-ml"
version = "0.1.0"
description = "Augmentation-first starter for tackle video experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tackle Vision" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "albumentations>=1.4",
  "ultralytics>=8.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
tackle-vision-ml = "tackle_vision_augment:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "tackle_vision_augment",
]

[tool.ruff]
line-length = 100
target-version = "py310"
